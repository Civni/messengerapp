<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск собеседника...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="5">
    <style>
        body {
            background-color: #0d0d1a;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        .neon-spinner {
            border: 0.25em solid rgba(0, 255, 255, 0.2);
            border-top: 0.25em solid #00ffff;
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            box-shadow: 0 0 20px #00ffff;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .btn-neon {
            background-color: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        .btn-neon:hover {
            background-color: #00ffff;
            color: #0d0d1a;
            box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
        }

        p, h1 {
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-3">Поиск собеседника...</h1>
    <div class="neon-spinner" role="status"></div>
    <p class="mt-4">Пожалуйста, подождите. Как только кто-то найдётся, вас перенаправит в чат.</p>
    <a href="{% url 'profile' %}" class="btn btn-neon mt-4">Отменить поиск</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function checkChatStatus() {
        const response = await fetch('/check_chat/');
        const data = await response.json();
        if (data.chat_id) {
            window.location.href = '/chat/' + data.chat_id + '/';
        }
    }

    setInterval(checkChatStatus, 2000);
</script>

</body>
</html>
