<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d1a;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .neon-card {
            background-color: rgba(0, 0, 50, 0.2);
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px #00ffff;
            border-radius: 15px;
            padding: 30px;
        }

        .neon-text {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ccff;
        }

        .text-muted {
            color: #66ffff !important;
        }

        .btn-neon {
            background-color: #00ffff;
            border: none;
            color: #0d0d1a;
            font-weight: bold;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        .btn-neon:hover {
            background-color: #00ccff;
            box-shadow: 0 0 20px #00ccff, 0 0 30px #00ccff;
        }

        .btn-outline-neon {
            border: 1px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .btn-outline-neon:hover {
            background-color: #00ffff;
            color: #0d0d1a;
            box-shadow: 0 0 20px #00ffff;
        }

        a {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        a:hover {
            text-shadow: 0 0 15px #00ffff;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 neon-card text-center">
            <img src="{{ user.avatar.url }}" class="rounded-circle mb-3" width="150" height="150" alt="Аватарка">
            <h2 class="neon-text">{{ user.username }}</h2>
            <h5 class="text-muted">@{{ user.tag }}</h5>
            <p class="mt-3">{{ user.bio|default:"Нет описания" }}</p>

            <div class="d-grid gap-2 col-6 mx-auto mt-4">
                <a href="{% url 'find_partner' %}" class="btn btn-neon btn-lg">Искать собеседника</a>
                <a href="{% url 'profile_edit' %}" class="btn btn-outline-neon">Редактировать профиль</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-neon">Выйти</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
