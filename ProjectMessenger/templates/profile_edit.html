<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d1a;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .neon-card {
            background-color: rgba(0, 0, 50, 0.2);
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px #00ffff;
            border-radius: 15px;
            padding: 30px;
        }

        .neon-text {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ccff;
        }

        .btn-neon {
            background-color: #00ffff;
            border: none;
            color: #0d0d1a;
            font-weight: bold;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        .btn-neon:hover {
            background-color: #00ccff;
            box-shadow: 0 0 20px #00ccff, 0 0 30px #00ccff;
        }

        a {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        a:hover {
            text-shadow: 0 0 15px #00ffff;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 neon-card">
            <h2 class="text-center neon-text mb-4">Редактировать профиль</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid">
                    <button type="submit" class="btn btn-neon">Сохранить изменения</button>
                </div>
            </form>
            <p class="text-center mt-3">
                <a href="{% url 'profile' %}">Назад в профиль</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
